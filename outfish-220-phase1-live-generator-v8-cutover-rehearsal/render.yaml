services:
  - type: web
    name: outfish-220-phase1-staging
    runtime: python
    plan: starter
    buildCommand: "python generator.py --self-test && python -m py_compile service.py production_compare.py"
    startCommand: "python service.py"
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_STORE_DOMAIN
        value: 153ac6-2.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: GENERATOR_MODE
        value: live
      - key: REFRESH_SECONDS
        value: "21600"
      - key: EXPECTED_EXPORT_ROWS
        value: "672"
      - key: PRODUCTION_FEED_URL
        value: https://outfish-220-stock-feed.onrender.com/220-stock.xml
