name: one-shot public cold-start probe
on:
  push:
    branches: [master-driven-runtime]
    paths: [.github/workflows/cold-start-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cold-start recovered state
        shell: bash
        run: |
          set -euo pipefail
          base='https://outfish-220-master-driven-staging.onrender.com'
          curl -fsS -D /tmp/xml.headers "$base/220-stock-master-driven.xml" -o /tmp/feed.xml
          echo "PUBLIC_XML_STATUS=$(awk 'NR==1{print $2}' /tmp/xml.headers)"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/feed.xml').getroot()
          print('XML_ROOT='+root.tag)
          print('XML_ROWS='+str(len(root.findall('product'))))
          PY
          curl -fsS "$base/health" -o /tmp/health.json
          curl -fsS "$base/audit" -o /tmp/audit.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          a=json.load(open('/tmp/audit.json'))
          print('HEALTH='+json.dumps(h,sort_keys=True))
          keys=['identity_coverage','source_coverage','shopify_mapped_expected','shopify_fetched','sia_external_expected','sia_external_fetched','runtime_ok','blocked','generated_xml_rows','dataset_sha256','service_status','persistence_status','recovered_from_durable']
          print('AUDIT='+json.dumps({k:a.get(k) for k in keys},sort_keys=True))
          PY
      - name: Execute exactly one refresh
        shell: bash
        run: |
          set -euo pipefail
          base='https://outfish-220-master-driven-staging.onrender.com'
          curl -fsS -X POST "$base/refresh" -o /tmp/refresh.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/refresh.json'))
          keys=['service_status','identity_coverage','source_coverage','shopify_fetched','sia_external_fetched','runtime_ok','blocked','generated_xml_rows','dataset_sha256','refresh_id']
          print('REFRESH='+json.dumps({k:r.get(k) for k in keys},sort_keys=True))
          PY
      - name: Probe after refresh
        shell: bash
        run: |
          set -euo pipefail
          base='https://outfish-220-master-driven-staging.onrender.com'
          curl -fsS -D /tmp/xml2.headers "$base/220-stock-master-driven.xml" -o /tmp/feed2.xml
          curl -fsS "$base/health" -o /tmp/health2.json
          curl -fsS "$base/audit" -o /tmp/audit2.json
          echo "PUBLIC_XML_STATUS_AFTER=$(awk 'NR==1{print $2}' /tmp/xml2.headers)"
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          print('XML_ROWS_AFTER='+str(len(ET.parse('/tmp/feed2.xml').getroot().findall('product'))))
          h=json.load(open('/tmp/health2.json')); a=json.load(open('/tmp/audit2.json'))
          print('HEALTH_AFTER='+json.dumps(h,sort_keys=True))
          keys=['identity_coverage','source_coverage','shopify_mapped_expected','shopify_fetched','sia_external_expected','sia_external_fetched','runtime_ok','blocked','generated_xml_rows','dataset_sha256','service_status','persistence_status','recovered_from_durable','refresh_id']
          print('AUDIT_AFTER='+json.dumps({k:a.get(k) for k in keys},sort_keys=True))
          PY